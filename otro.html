  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

3, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Plus Jakarta Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"e170b546-8afe-4eda-88d3-8e3fc162c2f9\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Plus Jakarta Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"c6ca516e-d50a-48a3-810a-afc269619086\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ---------- BRAND CORE ---------- */\n  /* Newell corporate blue (cover backgrounds, hero artwork) */\n  --newell-blue: #298fc2;\n  --newell-blue-tint: #3d98cd;\n  --newell-blue-deep: #1a6d99;\n\n  /* Newell / Oster deep navy (section dividers, primary surfaces) */\n  --newell-navy: #001438;          /* sampled #001437 / #001438 / #00143A */\n  --newell-navy-2: #0e2841;         /* theme accent navy */\n  --newell-indigo: #1e2761;         /* secondary accent navy */\n  --oster-navy: #001438;            /* alias for Oster sub-brand */\n\n  /* Champagne / taupe — Newell Brands wordmark + Oster gold accent */\n  --champagne: #ae9571;\n  --champagne-dark: #8d7657;\n  --champagne-pale: #d6c3a4;\n  --taupe-text: #35302C;            /* warm dark used in body copy */\n\n  /* ---------- NEUTRALS ---------- */\n  --white: #ffffff;\n  --paper: #fdfcf9;                 /* tinted paper background */\n  --bg-cool: #f1f4f9;                /* cool light surface */\n  --bg-cool-2: #d1d9e6;\n  --bg-cool-3: #c8d8f0;\n  --bg-violet: #d1d4e7;              /* table row tint used in slide 5/6 */\n  --line: #e3e8ef;\n  --line-strong: #cbd2dc;\n  --slate-700: #334155;\n  --slate-600: #475569;\n  --slate-500: #64748b;\n  --slate-400: #94a3b8;\n  --slate-300: #cbd5e1;\n  --black: #000000;\n\n  /* ---------- SEMANTIC (status pills from the priority table) ---------- */\n  --success: #22a06b;\n  --success-strong: #00b050;\n  --warning: #ffc000;\n  --warning-amber: #f59e0b;\n  --danger: #d93025;\n  --info: #298fc2;\n  --neutral-flag: #64748b;\n\n  /* ---------- SEMANTIC ROLES ---------- */\n  --fg-1: #0b1326;                  /* primary text */\n  --fg-2: #35302c;                  /* warm secondary */\n  --fg-3: #64748b;                  /* tertiary, captions */\n  --fg-on-dark: #ffffff;\n  --fg-on-dark-soft: rgba(255, 255, 255, 0.72);\n  --fg-on-dark-faint: rgba(255, 255, 255, 0.45);\n\n  --bg-1: #ffffff;\n  --bg-2: var(--bg-cool);\n  --bg-dark: var(--newell-navy);\n\n  --border-1: var(--line);\n  --border-2: var(--line-strong);\n  --border-on-dark: rgba(255, 255, 255, 0.18);\n\n  /* ---------- TYPOGRAPHY ---------- */\n  /* Substitution note: the source deck uses Aptos / Aptos Display\n     (Microsoft proprietary). Closest free pairing on Google Fonts: */\n  --font-display: \"Manrope\", \"Aptos Display\", \"Avenir Next\", system-ui, sans-serif;\n  --font-body:    \"Plus Jakarta Sans\", \"Aptos\", \"Avenir\", system-ui, sans-serif;\n  --font-mono:    \"JetBrains Mono\", ui-monospace, \"SF Mono\", Menlo, monospace;\n\n  /* Scale (16-base, 1.25 ratio for body; modular for display) */\n  --fs-12: 12px;\n  --fs-13: 13px;\n  --fs-14: 14px;\n  --fs-16: 16px;\n  --fs-18: 18px;\n  --fs-20: 20px;\n  --fs-24: 24px;\n  --fs-28: 28px;\n  --fs-32: 32px;\n  --fs-40: 40px;\n  --fs-48: 48px;\n  --fs-64: 64px;\n  --fs-80: 80px;\n  --fs-96: 96px;\n\n  /* ---------- SPACING (4px grid) ---------- */\n  --s-1: 4px;\n  --s-2: 8px;\n  --s-3: 12px;\n  --s-4: 16px;\n  --s-5: 20px;\n  --s-6: 24px;\n  --s-8: 32px;\n  --s-10: 40px;\n  --s-12: 48px;\n  --s-16: 64px;\n  --s-20: 80px;\n\n  /* ---------- RADIUS ---------- */\n  --r-sm: 4px;\n  --r-md: 8px;\n  --r-lg: 14px;\n  --r-xl: 22px;\n  --r-pill: 999px;\n\n  /* ---------- SHADOWS ---------- */\n  --shadow-sm: 0 1px 2px rgba(11, 19, 38, 0.06), 0 1px 1px rgba(11, 19, 38, 0.04);\n  --shadow-md: 0 4px 12px rgba(11, 19, 38, 0.08), 0 1px 2px rgba(11, 19, 38, 0.04);\n  --shadow-lg: 0 18px 38px -16px rgba(0, 20, 56, 0.30), 0 4px 10px rgba(11, 19, 38, 0.06);\n  --shadow-deep: 0 30px 60px -28px rgba(0, 20, 56, 0.55);\n  --shadow-on-dark: 0 10px 28px -10px rgba(0, 0, 0, 0.55);\n\n  /* Inner edge highlight, common on capsule pills used in tables */\n  --inset-hairline: inset 0 1px 0 rgba(255, 255, 255, 0.65);\n\n  /* ---------- MOTION ---------- */\n  --ease-out:  cubic-bezier(0.22, 0.61, 0.36, 1);\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);\n  --dur-fast: 120ms;\n  --dur: 200ms;\n  --dur-slow: 360ms;\n}\n\n/* ============================================================\n   SEMANTIC TYPE STYLES\n   Use as classes (.h1 …) or apply the vars directly.\n   ============================================================ */\n\nhtml, body {\n  font-family: var(--font-body);\n  color: var(--fg-1);\n  font-size: var(--fs-16);\n  line-height: 1.5;\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n}\n\n.display-xl, h1.display {\n  font-family: var(--font-display);\n  font-weight: 800;\n  font-size: var(--fs-96);\n  line-height: 1.02;\n  letter-spacing: -0.02em;\n  color: var(--fg-1);\n}\n\n.h1, h1 {\n  font-family: var(--font-display);\n  font-weight: 800;\n  font-size: var(--fs-48);\n  line-height: 1.08;\n  letter-spacing: -0.015em;\n}\n\n.h2, h2 {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: var(--fs-32);\n  line-height: 1.15;\n  letter-spacing: -0.01em;\n}\n\n.h3, h3 {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: var(--fs-24);\n  line-height: 1.22;\n  letter-spacing: -0.005em;\n}\n\n.h4, h4 {\n  font-family: var(--font-body);\n  font-weight: 700;\n  font-size: var(--fs-18);\n  line-height: 1.3;\n}\n\n.eyebrow {\n  font-family: var(--font-body);\n  font-weight: 600;\n  font-size: var(--fs-12);\n  letter-spacing: 0.16em;\n  text-transform: uppercase;\n  color: var(--champagne);\n}\n\n.lead {\n  font-family: var(--font-body);\n  font-weight: 400;\n  font-size: var(--fs-20);\n  line-height: 1.45;\n  color: var(--fg-2);\n}\n\np, .body {\n  font-family: var(--font-body);\n  font-weight: 400;\n  font-size: var(--fs-16);\n  line-height: 1.55;\n  color: var(--fg-1);\n  text-wrap: pretty;\n}\n\n.body-sm, small {\n  font-size: var(--fs-13);\n  line-height: 1.5;\n  color: var(--fg-3);\n}\n\n.caption {\n  font-family: var(--font-body);\n  font-weight: 500;\n  font-size: var(--fs-12);\n  letter-spacing: 0.04em;\n  text-transform: uppercase;\n  color: var(--fg-3);\n}\n\n.code, code, kbd, pre {\n  font-family: var(--font-mono);\n  font-size: 0.92em;\n}\n\n/* Brand-flavored display variants */\n.display-oster {\n  font-family: var(--font-display);\n  font-weight: 800;\n  text-transform: uppercase;\n  letter-spacing: 0.01em;\n  color: var(--white);\n}\n.display-oster .accent { color: var(--champagne); font-weight: 500; letter-spacing: 0.08em; }\n<\u002Fstyle>\n<style>/* ============================================================\n   BLEND / NEWELL & CLAUDE — DESIGN CHALLENGE DECK\n   Surface: Oster deep navy. Accent: champagne gold + Newell blue.\n   Built on Newell Brands MX design-system tokens.\n   ============================================================ */\n\n*, *::before, *::after { box-sizing: border-box; }\n\ndeck-stage:not(:defined) { visibility: hidden; }\ndeck-stage { background: #00081c; }\n\n/* ---- SLIDE BASE (component sizes/positions the <section>) -------- */\n.slide {\n  font-family: var(--font-body);\n  color: var(--fg-on-dark);\n  background: var(--newell-navy);\n  overflow: hidden;\n  --pad: 112px;\n}\n.slide.navy {\n  background:\n    radial-gradient(118% 80% at 80% 8%, rgba(41,143,194,0.22), transparent 56%),\n    radial-gradient(130% 95% at 6% 104%, rgba(0,5,18,0.9), transparent 58%),\n    var(--newell-navy);\n}\n\n/* faint line-icon texture */\n.pattern {\n  position: absolute; inset: 0; z-index: 0;\n  background-image: url(\"62fbe660-e16f-4ad0-8ac8-3e3cf345e05c\");\n  background-size: 1080px auto;\n  filter: brightness(0) invert(1);\n  opacity: 0.04;\n  pointer-events: none;\n}\n\n/* ---- LAYOUT SHELL ------------------------------------------------ */\n.frame {\n  position: absolute; inset: 0;\n  display: flex; flex-direction: column;\n  padding: 150px var(--pad) 112px;\n  z-index: 2;\n}\n.head { position: relative; margin-bottom: 46px; flex: none; }\n.content { flex: 1; min-height: 0; display: flex; flex-direction: column; }\n\n/* ---- CHROME ------------------------------------------------------ */\n.chrome-top {\n  position: absolute; top: 58px; left: var(--pad); right: var(--pad);\n  display: flex; align-items: center; justify-content: space-between;\n  z-index: 4;\n}\n.logo-mark { display: flex; align-items: center; gap: 16px; }\n.logo-mark img { height: 28px; width: auto; opacity: 0.96; }\n.logo-mark .bar { width: 1px; height: 24px; background: rgba(255,255,255,0.22); }\n.logo-mark span {\n  font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase;\n  font-weight: 600; color: var(--fg-on-dark-soft);\n}\n.page-num { font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.14em; color: var(--champagne-pale); }\n.page-num b { color: var(--white); font-weight: 500; }\n\n.chrome-bottom {\n  position: absolute; bottom: 50px; left: var(--pad); right: var(--pad);\n  display: flex; align-items: center; justify-content: space-between;\n  z-index: 4; font-size: 12px; letter-spacing: 0.06em; color: var(--fg-on-dark-faint);\n}\n.chrome-bottom .conf { text-transform: uppercase; letter-spacing: 0.18em; }\n\n/* ---- TYPE -------------------------------------------------------- */\n.eyebrow-row { display: flex; align-items: center; gap: 16px; }\n.eyebrow {\n  font-family: var(--font-body); font-weight: 600;\n  font-size: 16px; letter-spacing: 0.26em; text-transform: uppercase;\n  color: var(--champagne); margin: 0;\n}\n.eyebrow-rule { height: 1px; width: 64px; background: linear-gradient(90deg, var(--champagne), transparent); }\n.title {\n  font-family: var(--font-display); font-weight: 800;\n  letter-spacing: -0.02em; line-height: 1.03; color: var(--white);\n  margin: 22px 0 0; font-size: 62px;\n}\n.title .gold { color: var(--champagne); }\n.lead {\n  font-weight: 400; color: var(--fg-on-dark-soft); text-wrap: pretty; margin: 20px 0 0;\n  font-size: 23px; line-height: 1.5; max-width: 1180px;\n}\n\n/* ---- CARD GRID --------------------------------------------------- */\n.grid { display: grid; gap: 28px; flex: 1; min-height: 0; align-content: center; grid-auto-rows: min-content; }\n.card {\n  background: linear-gradient(180deg, rgba(255,255,255,0.058), rgba(255,255,255,0.022));\n  border: 1px solid rgba(255,255,255,0.10);\n  border-radius: var(--r-xl);\n  box-shadow: var(--shadow-on-dark), inset 0 1px 0 rgba(255,255,255,0.07);\n  padding: 38px 34px;\n  display: flex; flex-direction: column;\n  position: relative; overflow: hidden;\n}\n.card .num {\n  position: absolute; top: 28px; right: 32px;\n  font-family: var(--font-mono); font-size: 14px;\n  color: var(--champagne); opacity: 0.5; letter-spacing: 0.06em;\n}\n.chip {\n  width: 72px; height: 72px; border-radius: var(--r-lg);\n  display: grid; place-items: center; flex: none;\n  background: radial-gradient(120% 120% at 30% 18%, rgba(174,149,113,0.30), rgba(174,149,113,0.08));\n  border: 1px solid rgba(174,149,113,0.45);\n  box-shadow: inset 0 1px 0 rgba(255,255,255,0.14);\n}\n.chip img { width: 38px; height: 38px; }\n.chip.blue {\n  background: radial-gradient(120% 120% at 30% 18%, rgba(61,152,205,0.34), rgba(41,143,194,0.08));\n  borde
